# docs/ 폴더를 GitHub Pages 에 배포한다.
#   /       : 본인용 사이트 (docs/config.js → naver-news 함수, 서버에 저장된 키 사용)
#   /corp/  : 배포용 사이트 (docs/corp/config.js → naver-news-corp 함수, 사용자가 키 입력 + 이용 안내 탭)
#             화면 코드는 docs/index.html · ai-export.js 를 그대로 복사해 쓰고, 설정과 캡처만 다르다.
# 사용하려면 레포 Settings → Pages → Source 를 "GitHub Actions" 로 설정.
# Actions 탭 → "Deploy GitHub Pages" → Run workflow 로 수동 배포도 가능.
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy-github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Build site
        run: |
          cp -r docs _site
          cp docs/index.html docs/ai-export.js _site/corp/
          # 브라우저가 이전 버전 js 를 캐시해 두지 않도록 배포마다 버전을 붙인다.
          sed -i "s/__BUILD__/${GITHUB_SHA::7}/g" _site/index.html _site/corp/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
