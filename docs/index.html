<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>네이버 뉴스 검색 정리 툴</title>
<style>
  :root { --brand:#03c75a; --bg:#f5f6f8; --line:#e3e5e8; --muted:#6b7280; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Malgun Gothic","맑은 고딕",sans-serif;
         background:var(--bg); color:#1f2328; }
  header { background:var(--brand); color:#fff; padding:18px 24px; font-size:20px; font-weight:700; }
  .wrap { max-width:1100px; margin:0 auto; padding:24px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:12px; padding:20px; margin-bottom:20px; }
  label { display:block; font-size:13px; font-weight:600; margin-bottom:6px; color:#374151; }
  input[type=text],input[type=password],input[type=date],input[type=number] {
    width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:8px; font-size:14px; }
  .row { display:flex; gap:16px; flex-wrap:wrap; }
  .row > div { flex:1; min-width:160px; }
  .cred { border:1px dashed var(--line); border-radius:8px; padding:14px; margin-bottom:16px; background:#fafbfc; }
  summary { cursor:pointer; font-weight:600; font-size:13px; color:#374151; }
  .chk { display:flex; align-items:center; gap:8px; margin-top:14px; font-size:14px; }
  .chk input { width:auto; }
  button { background:var(--brand); color:#fff; border:0; border-radius:8px; padding:12px 22px;
           font-size:15px; font-weight:700; cursor:pointer; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  button.ghost { background:#fff; color:#1f2328; border:1px solid var(--line); }
  .actions { display:flex; gap:10px; align-items:center; margin-top:16px; flex-wrap:wrap; }
  .hint { font-size:12px; color:var(--muted); margin-top:6px; }
  .warn { background:#fff7ed; border:1px solid #fed7aa; color:#9a3412; padding:12px; border-radius:8px;
          font-size:13px; margin-bottom:16px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th,td { border-bottom:1px solid var(--line); padding:10px; text-align:left; vertical-align:top; }
  th { background:#f9fafb; font-size:12px; color:var(--muted); position:sticky; top:0; }
  td.body { max-width:480px; white-space:pre-wrap; color:#374151; }
  .tablewrap { max-height:560px; overflow:auto; border:1px solid var(--line); border-radius:8px; }
  a { color:#0969da; text-decoration:none; }
  .spin { display:inline-block; width:16px; height:16px; border:2px solid #fff; border-top-color:transparent;
          border-radius:50%; animation:sp .8s linear infinite; vertical-align:middle; }
  @keyframes sp { to { transform:rotate(360deg); } }
  .count { font-size:14px; color:var(--muted); }
  select { width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:8px; font-size:14px; background:#fff; }
  h3 { margin:0 0 4px; font-size:16px; }
  .stats { font-size:13px; color:#374151; background:#f9fafb; border:1px solid var(--line); border-radius:8px;
           padding:10px 12px; margin-top:14px; }
</style>
</head>
<body>
<header>📰 네이버 뉴스 검색 정리 툴</header>
<div class="wrap">

  <div class="card">
    <div id="configWarn"></div>

    <div style="margin-bottom:16px">
      <label>검색 키워드</label>
      <input type="text" id="keyword" placeholder="예: 인공지능 반도체">
    </div>

    <div class="row">
      <div>
        <label>시작일</label>
        <input type="date" id="startDate">
      </div>
      <div>
        <label>종료일</label>
        <input type="date" id="endDate">
      </div>
      <div>
        <label>최대 수집 건수 (1~1000)</label>
        <input type="number" id="maxCount" value="100" min="1" max="1000">
      </div>
    </div>

    <label class="chk">
      <input type="checkbox" id="fetchBody" checked>
      기사 본문 전체 수집 (각 링크 접속 — 느리지만 "주요 내용"이 요약이 아닌 본문으로 채워짐)
    </label>

    <div class="actions">
      <button id="searchBtn" onclick="doSearch()">검색</button>
      <button class="ghost" id="csvBtn" onclick="download('csv')" disabled>CSV 다운로드</button>
      <button class="ghost" id="xlsxBtn" onclick="download('xlsx')" disabled>Excel 다운로드</button>
      <span class="count" id="status"></span>
    </div>
  </div>

  <div id="warnBox"></div>

  <div class="card" id="resultCard" style="display:none">
    <div class="tablewrap">
      <table>
        <thead><tr><th>제목</th><th>일자</th><th>출처</th><th>주요 내용</th></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>

  <div class="card" id="aiCard" style="display:none">
    <h3>🤖 AI 분석용 내보내기</h3>
    <div class="hint" style="margin:0 0 16px">
      검색 결과를 AI(Copilot 등)가 읽기 좋은 JSON 으로 정리하고, 이슈별 분류·요약을 시키는 지시문을 함께 만듭니다.
      JSON 파일을 첨부하고 지시문을 붙여넣으면 됩니다.
    </div>
    <div class="row">
      <div>
        <label>회사명</label>
        <input type="text" id="aiCompany" placeholder="예: OO전자">
      </div>
      <div>
        <label>다른 이름 (쉼표로 구분)</label>
        <input type="text" id="aiAliases" placeholder="예: OO, OO Electronics">
      </div>
    </div>
    <div class="row" style="margin-top:16px">
      <div>
        <label>기사 발췌 길이</label>
        <select id="aiLevel">
          <option value="short">짧게 — 기사당 약 300자</option>
          <option value="normal" selected>보통 — 기사당 약 600자 (권장)</option>
          <option value="full">본문 전체</option>
        </select>
      </div>
      <div>
        <label>파일당 최대 글자 수 (넘으면 여러 파일로 나눔)</label>
        <input type="number" id="aiMaxChars" value="60000" min="5000" step="5000">
      </div>
    </div>
    <div class="hint">발췌 = 기사 앞부분 2~3문장 + 회사명이 나오는 문장. 기자 이름·저작권 문구 등은 제거되고, 제목이 거의 같은 기사는 하나로 합쳐집니다.</div>
    <div class="stats" id="aiStats"></div>
    <div class="actions">
      <button id="aiJsonBtn" onclick="exportAiJson()">JSON 내보내기</button>
      <button class="ghost" onclick="copyAiPrompt()">지시문 복사</button>
      <button class="ghost" onclick="downloadAiPrompt()">지시문 다운로드</button>
      <span class="count" id="aiMsg"></span>
    </div>
  </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="config.js?v=__BUILD__"></script>
<script src="ai-export.js?v=__BUILD__"></script>
<script>
  const FUNCTION_URL = window.NAVER_NEWS_FUNCTION_URL || '';
  const BODY_BATCH = 20;     // Edge Function 1회 호출당 본문 수집 건수 (서버 최대 20)
  const BODY_PARALLEL = 2;   // 동시에 보낼 본문 수집 요청 수
  let ARTICLES = [];
  let busy = false;

  if (!FUNCTION_URL || FUNCTION_URL.includes('<project-ref>')) {
    document.getElementById('configWarn').innerHTML =
      '<div class="warn">⚠ docs/config.js 의 Supabase Edge Function 주소가 아직 설정되지 않았습니다.</div>';
  }

  // 기본 기간: 최근 7일 (브라우저 현지 날짜 기준)
  function ymd(d) {
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }
  document.getElementById('endDate').value = ymd(new Date());
  document.getElementById('startDate').value = ymd(new Date(Date.now() - 6*864e5));
  document.getElementById('keyword').addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });

  function setStatus(html) { document.getElementById('status').innerHTML = html; }

  function setBusy(b) {
    busy = b;
    document.getElementById('searchBtn').disabled = b;
    document.getElementById('csvBtn').disabled = b || !ARTICLES.length;
    document.getElementById('xlsxBtn').disabled = b || !ARTICLES.length;
    document.getElementById('aiJsonBtn').disabled = b || !ARTICLES.length;
    if (!b && ARTICLES.length) updateAiStats();
  }

  async function callFunction(payload) {
    const res = await fetch(FUNCTION_URL, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify(payload)
    });
    const data = await res.json().catch(() => ({ error: '서버 응답을 해석할 수 없습니다. (HTTP ' + res.status + ')' }));
    if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
    return data;
  }

  async function doSearch() {
    if (busy) return;
    const keyword = document.getElementById('keyword').value.trim();
    if (!keyword) { alert('검색 키워드를 입력하세요.'); return; }
    const fetchBody = document.getElementById('fetchBody').checked;
    if (!aiEl('aiCompany').value.trim()) aiEl('aiCompany').value = keyword;
    document.getElementById('warnBox').innerHTML = '';

    setBusy(true);
    setStatus('<span class="spin" style="border-color:#6b7280;border-top-color:transparent"></span> 검색 중…');
    try {
      const data = await callFunction({
        action: 'search',
        keyword,
        start_date: document.getElementById('startDate').value,
        end_date: document.getElementById('endDate').value,
        max_count: parseInt(document.getElementById('maxCount').value) || 100,
      });
      ARTICLES = data.articles || [];
      renderTable(data.warning);
      setStatus('총 ' + ARTICLES.length + '건');
      if (!ARTICLES.length) { alert('해당 기간에 검색된 기사가 없습니다.'); return; }
      if (fetchBody) await fetchBodies();
      setStatus('총 ' + ARTICLES.length + '건');
    } catch (e) {
      setStatus('');
      alert('요청 실패: ' + e.message);
    } finally {
      setBusy(false);
    }
  }

  // 본문은 Edge Function 실행 시간 제한 때문에 BODY_BATCH 건씩 나눠 요청
  async function fetchBodies() {
    const batches = [];
    for (let i = 0; i < ARTICLES.length; i += BODY_BATCH) batches.push(ARTICLES.slice(i, i + BODY_BATCH));
    let done = 0, failed = 0, next = 0;
    const progress = () => setStatus('<span class="spin" style="border-color:#6b7280;border-top-color:transparent"></span> 본문 수집 중… ' + done + ' / ' + ARTICLES.length);
    progress();

    async function worker() {
      while (next < batches.length) {
        const batch = batches[next++];
        try {
          const data = await callFunction({ action: 'bodies', urls: batch.map(a => a.link || a.originallink) });
          (data.results || []).forEach((r, i) => {
            if (r.body) { batch[i].body = r.body; batch[i].full = true; }
            if (r.source) batch[i].source = r.source;
          });
        } catch (e) {
          failed += batch.length;  // 실패한 묶음은 API 요약을 그대로 사용
        }
        done += batch.length;
        progress();
        renderTable();
      }
    }
    await Promise.all(Array.from({ length: BODY_PARALLEL }, worker));
    if (failed) addWarning(failed + '건은 본문 수집에 실패해 API 요약으로 채웠습니다.');
  }

  function esc(s){ return String(s||'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

  function addWarning(msg) {
    document.getElementById('warnBox').innerHTML += '<div class="warn">⚠ ' + esc(msg) + '</div>';
  }

  function renderTable(warning) {
    if (warning) addWarning(warning);
    const tbody = document.getElementById('tbody');
    tbody.innerHTML = '';
    ARTICLES.forEach(a => {
      const preview = (a.body || '').slice(0, 400);
      const tr = document.createElement('tr');
      tr.innerHTML =
        '<td><a href="'+esc(a.link)+'" target="_blank" rel="noopener">'+esc(a.title)+'</a></td>' +
        '<td>'+esc(a.date)+'</td>' +
        '<td>'+esc(a.source)+'</td>' +
        '<td class="body">'+esc(preview)+(a.body && a.body.length>400?'…':'')+'</td>';
      tbody.appendChild(tr);
    });
    document.getElementById('resultCard').style.display = ARTICLES.length ? '' : 'none';
    document.getElementById('aiCard').style.display = ARTICLES.length ? '' : 'none';
    if (ARTICLES.length) updateAiStats();
  }

  function download(fmt) {
    if (!ARTICLES.length) return;
    const keyword = document.getElementById('keyword').value.trim();
    const safeKw = keyword.replace(/[^\w가-힣]+/g, '_').slice(0, 30) || 'news';
    const now = new Date();
    const stamp = ymd(now).replace(/-/g, '') + '_' + String(now.getHours()).padStart(2,'0') + String(now.getMinutes()).padStart(2,'0');
    const name = 'naver_news_' + safeKw + '_' + stamp + '.' + fmt;

    const headers = ['제목', '일자', '출처', '주요 내용', '링크'];
    const rows = ARTICLES.map(a => [a.title||'', a.date||'', a.source||'', a.body||'', a.link||'']);

    if (fmt === 'xlsx') {
      // Excel 셀 최대 글자수(32,767) 초과 방지
      const safeRows = rows.map(r => r.map(v => v.length > 32000 ? v.slice(0, 32000) + '…' : v));
      const ws = XLSX.utils.aoa_to_sheet([headers, ...safeRows]);
      ws['!cols'] = [50, 18, 18, 80, 40].map(w => ({ wch: w }));
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, '뉴스');
      XLSX.writeFile(wb, name);
      return;
    }

    // CSV (Excel 한글 깨짐 방지용 BOM 포함)
    const cell = v => /[",\r\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
    const csv = [headers, ...rows].map(r => r.map(cell).join(',')).join('\r\n');
    const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = name; a.click();
    URL.revokeObjectURL(url);
  }

  // ------------------------------------------------------------------------- //
  // AI 분석용 내보내기
  // ------------------------------------------------------------------------- //
  const aiEl = id => document.getElementById(id);

  // 회사명/다른 이름은 브라우저에 기억 (저장 실패해도 동작에는 영향 없음)
  try {
    aiEl('aiCompany').value = localStorage.getItem('ai_company') || '';
    aiEl('aiAliases').value = localStorage.getItem('ai_aliases') || '';
  } catch (e) {}
  ['aiCompany', 'aiAliases', 'aiLevel', 'aiMaxChars'].forEach(id => aiEl(id).addEventListener('input', () => {
    try {
      localStorage.setItem('ai_company', aiEl('aiCompany').value);
      localStorage.setItem('ai_aliases', aiEl('aiAliases').value);
    } catch (e) {}
    updateAiStats();
  }));

  function aiOptions() {
    const company = aiEl('aiCompany').value.trim() || document.getElementById('keyword').value.trim();
    return {
      company,
      aliases: aiEl('aiAliases').value.split(',').map(s => s.trim()).filter(Boolean),
      keyword: document.getElementById('keyword').value.trim(),
      startDate: document.getElementById('startDate').value,
      endDate: document.getElementById('endDate').value,
      level: aiEl('aiLevel').value,
      maxChars: parseInt(aiEl('aiMaxChars').value) || 60000,
    };
  }

  function aiBuild() {
    const opts = aiOptions();
    return { opts, ...AIExport.buildExport(ARTICLES, opts) };
  }

  function updateAiStats() {
    if (!ARTICLES.length || busy) { aiEl('aiStats').textContent = busy ? '수집이 끝나면 계산됩니다.' : ''; return; }
    const { stats } = aiBuild();
    const noBody = ARTICLES.filter(a => !a.full).length;
    aiEl('aiStats').innerHTML =
      '내보낼 기사 <b>' + stats.exported + '건</b>' +
      (stats.merged ? ' (중복 ' + stats.merged + '건 합침)' : '') +
      ' · 약 <b>' + stats.totalChars.toLocaleString() + '자</b>' +
      ' · 파일 <b>' + stats.parts + '개</b>' +
      (stats.notMentioned ? '<br>회사명이 나오지 않는 기사 ' + stats.notMentioned + '건 (AI가 분석에서 제외)' : '') +
      (noBody ? '<br>본문 없이 API 요약만 있는 기사 ' + noBody + '건' : '');
  }

  function aiFileBase(opts) {
    const safe = (opts.company || 'news').replace(/[^\w가-힣]+/g, '_').slice(0, 30);
    const now = new Date();
    return safe + '_' + ymd(now).replace(/-/g, '') + '_' + String(now.getHours()).padStart(2,'0') + String(now.getMinutes()).padStart(2,'0');
  }

  function saveBlob(text, name, type) {
    const url = URL.createObjectURL(new Blob([text], { type }));
    const a = document.createElement('a');
    a.href = url; a.download = name; a.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  async function exportAiJson() {
    if (!ARTICLES.length || busy) return;
    const { opts, files } = aiBuild();
    if (!opts.company) { alert('회사명을 입력하세요.'); return; }
    const base = aiFileBase(opts);
    for (const f of files) {
      const suffix = files.length > 1 ? '_part' + f.part.index + 'of' + f.part.total : '';
      saveBlob(JSON.stringify(f, null, 2), 'ai_input_' + base + suffix + '.json', 'application/json');
      if (files.length > 1) await new Promise(r => setTimeout(r, 400));  // 연속 다운로드 차단 방지
    }
    aiEl('aiMsg').textContent = files.length > 1
      ? 'JSON ' + files.length + '개 저장됨 — 지시문과 함께 1번 파일부터 순서대로 보내세요.'
      : 'JSON 저장됨 — 지시문과 함께 AI에 첨부하세요.';
  }

  function aiPromptText() {
    const { opts, files } = aiBuild();
    return AIExport.buildPrompt(opts, files.length);
  }

  async function copyAiPrompt() {
    if (!ARTICLES.length) return;
    const text = aiPromptText();
    try {
      await navigator.clipboard.writeText(text);
      aiEl('aiMsg').textContent = '지시문이 복사되었습니다.';
    } catch (e) {
      downloadAiPrompt();
    }
  }

  function downloadAiPrompt() {
    if (!ARTICLES.length) return;
    saveBlob(aiPromptText(), 'ai_prompt_' + aiFileBase(aiOptions()) + '.txt', 'text/plain;charset=utf-8');
    aiEl('aiMsg').textContent = '지시문(txt)이 저장되었습니다.';
  }
</script>
</body>
</html>
