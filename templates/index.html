<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>네이버 뉴스 검색 정리 툴</title>
<style>
  :root { --brand:#03c75a; --bg:#f5f6f8; --line:#e3e5e8; --muted:#6b7280; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Malgun Gothic","맑은 고딕",sans-serif;
         background:var(--bg); color:#1f2328; }
  header { background:var(--brand); color:#fff; padding:18px 24px; font-size:20px; font-weight:700; }
  .wrap { max-width:1100px; margin:0 auto; padding:24px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:12px; padding:20px; margin-bottom:20px; }
  label { display:block; font-size:13px; font-weight:600; margin-bottom:6px; color:#374151; }
  input[type=text],input[type=password],input[type=date],input[type=number] {
    width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:8px; font-size:14px; }
  .row { display:flex; gap:16px; flex-wrap:wrap; }
  .row > div { flex:1; min-width:160px; }
  .cred { border:1px dashed var(--line); border-radius:8px; padding:14px; margin-bottom:16px; background:#fafbfc; }
  summary { cursor:pointer; font-weight:600; font-size:13px; color:#374151; }
  .chk { display:flex; align-items:center; gap:8px; margin-top:14px; font-size:14px; }
  .chk input { width:auto; }
  button { background:var(--brand); color:#fff; border:0; border-radius:8px; padding:12px 22px;
           font-size:15px; font-weight:700; cursor:pointer; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  button.ghost { background:#fff; color:#1f2328; border:1px solid var(--line); }
  .actions { display:flex; gap:10px; align-items:center; margin-top:16px; flex-wrap:wrap; }
  .hint { font-size:12px; color:var(--muted); margin-top:6px; }
  .warn { background:#fff7ed; border:1px solid #fed7aa; color:#9a3412; padding:12px; border-radius:8px;
          font-size:13px; margin-bottom:16px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th,td { border-bottom:1px solid var(--line); padding:10px; text-align:left; vertical-align:top; }
  th { background:#f9fafb; font-size:12px; color:var(--muted); position:sticky; top:0; }
  td.body { max-width:480px; white-space:pre-wrap; color:#374151; }
  .tablewrap { max-height:560px; overflow:auto; border:1px solid var(--line); border-radius:8px; }
  a { color:#0969da; text-decoration:none; }
  .spin { display:inline-block; width:16px; height:16px; border:2px solid #fff; border-top-color:transparent;
          border-radius:50%; animation:sp .8s linear infinite; vertical-align:middle; }
  @keyframes sp { to { transform:rotate(360deg); } }
  .count { font-size:14px; color:var(--muted); }
</style>
</head>
<body>
<header>📰 네이버 뉴스 검색 정리 툴</header>
<div class="wrap">

  <div class="card">
    <details class="cred" id="credBox">
      <summary>🔑 네이버 API 인증 정보 (한 번만 입력하면 브라우저에 저장됨)</summary>
      <div class="row" style="margin-top:12px">
        <div>
          <label>Client ID</label>
          <input type="text" id="clientId" value="{{ default_id }}" placeholder="네이버 개발자센터 발급">
        </div>
        <div>
          <label>Client Secret</label>
          <input type="password" id="clientSecret" value="{{ default_secret }}" placeholder="네이버 개발자센터 발급">
        </div>
      </div>
      <div class="hint">developers.naver.com → 애플리케이션 등록 → "검색" API 추가 후 발급.</div>
    </details>

    <div style="margin-bottom:16px">
      <label>검색 키워드</label>
      <input type="text" id="keyword" placeholder="예: 인공지능 반도체">
    </div>

    <div class="row">
      <div>
        <label>시작일</label>
        <input type="date" id="startDate">
      </div>
      <div>
        <label>종료일</label>
        <input type="date" id="endDate">
      </div>
      <div>
        <label>최대 수집 건수 (1~1000)</label>
        <input type="number" id="maxCount" value="100" min="1" max="1000">
      </div>
    </div>

    <label class="chk">
      <input type="checkbox" id="fetchBody" checked>
      기사 본문 전체 수집 (각 링크 접속 — 느리지만 "주요 내용"이 요약이 아닌 본문으로 채워짐)
    </label>

    <div class="actions">
      <button id="searchBtn" onclick="doSearch()">검색</button>
      <button class="ghost" id="csvBtn" onclick="download('csv')" disabled>CSV 다운로드</button>
      <button class="ghost" id="xlsxBtn" onclick="download('xlsx')" disabled>Excel 다운로드</button>
      <span class="count" id="status"></span>
    </div>
  </div>

  <div id="warnBox"></div>

  <div class="card" id="resultCard" style="display:none">
    <div class="tablewrap">
      <table>
        <thead><tr><th>제목</th><th>일자</th><th>출처</th><th>주요 내용</th></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>

</div>

<script>
  let ARTICLES = [];

  // 인증정보 localStorage 저장/복원
  const idEl = document.getElementById('clientId');
  const secEl = document.getElementById('clientSecret');
  if (!idEl.value) idEl.value = localStorage.getItem('naver_cid') || '';
  if (!secEl.value) secEl.value = localStorage.getItem('naver_csec') || '';
  if (idEl.value || secEl.value) document.getElementById('credBox').open = false;
  else document.getElementById('credBox').open = true;

  // 기본 기간: 최근 7일
  const today = new Date();
  const weekAgo = new Date(Date.now() - 6*864e5);
  document.getElementById('endDate').value = today.toISOString().slice(0,10);
  document.getElementById('startDate').value = weekAgo.toISOString().slice(0,10);

  function setBusy(b) {
    document.getElementById('searchBtn').disabled = b;
    document.getElementById('status').innerHTML = b
      ? '<span class="spin"></span> 수집 중… (본문 수집 시 시간이 걸립니다)' : '';
  }

  async function doSearch() {
    const payload = {
      client_id: idEl.value.trim(),
      client_secret: secEl.value.trim(),
      keyword: document.getElementById('keyword').value.trim(),
      start_date: document.getElementById('startDate').value,
      end_date: document.getElementById('endDate').value,
      fetch_body: document.getElementById('fetchBody').checked,
      max_count: parseInt(document.getElementById('maxCount').value) || 100,
    };
    localStorage.setItem('naver_cid', payload.client_id);
    localStorage.setItem('naver_csec', payload.client_secret);
    document.getElementById('warnBox').innerHTML = '';

    setBusy(true);
    try {
      const res = await fetch('/api/search', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      if (!res.ok) { alert(data.error || '오류가 발생했습니다.'); return; }
      ARTICLES = data.articles || [];
      renderTable(data);
    } catch (e) {
      alert('요청 실패: ' + e.message);
    } finally {
      setBusy(false);
    }
  }

  function esc(s){ return (s||'').replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

  function renderTable(data) {
    if (data.warning) {
      document.getElementById('warnBox').innerHTML = '<div class="warn">⚠ ' + esc(data.warning) + '</div>';
    }
    const tbody = document.getElementById('tbody');
    tbody.innerHTML = '';
    ARTICLES.forEach(a => {
      const preview = (a.body || '').slice(0, 400);
      const tr = document.createElement('tr');
      tr.innerHTML =
        '<td><a href="'+esc(a.link)+'" target="_blank">'+esc(a.title)+'</a></td>' +
        '<td>'+esc(a.date)+'</td>' +
        '<td>'+esc(a.source)+'</td>' +
        '<td class="body">'+esc(preview)+(a.body && a.body.length>400?'…':'')+'</td>';
      tbody.appendChild(tr);
    });
    document.getElementById('resultCard').style.display = ARTICLES.length ? '' : 'none';
    document.getElementById('status').textContent = '총 ' + ARTICLES.length + '건';
    const has = ARTICLES.length > 0;
    document.getElementById('csvBtn').disabled = !has;
    document.getElementById('xlsxBtn').disabled = !has;
    if (!has) alert('해당 기간에 검색된 기사가 없습니다.');
  }

  async function download(fmt) {
    if (!ARTICLES.length) return;
    const res = await fetch('/api/download', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        articles: ARTICLES, format: fmt,
        keyword: document.getElementById('keyword').value.trim()
      })
    });
    const blob = await res.blob();
    const dispo = res.headers.get('Content-Disposition') || '';
    const m = dispo.match(/filename="?([^"]+)"?/);
    const name = m ? m[1] : ('naver_news.' + fmt);
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = name; a.click();
    URL.revokeObjectURL(url);
  }
</script>
</body>
</html>
